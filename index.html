<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <header>
    <h1>💰 Controle Financeiro</h1>
    <button id="toggleTema">🌙</button>
  </header>

  <div id="notificacao" class="notificacao"></div>

  <!-- BOTÃO NOVA CONTA -->
  <section class="card">
    <button class="btn-primary" onclick="abrirModalCadastro()">
      ➕ Nova Conta
    </button>
  </section>

  <!-- AÇÕES -->
  <section class="card acoes-topo">
    <button class="btn-danger" onclick="apagarContaPorNome()">
      🗑 Apagar Conta pelo Nome
    </button>
  </section>

  <!-- FILTROS -->
  <section class="card filtros">
    <input type="text"
           id="busca"
           placeholder="🔎 Buscar conta..."
           onkeyup="renderizar()">

    <select id="filtroStatus" onchange="renderizar()">
      <option value="todas">Todas</option>
      <option value="pendente">Pendentes</option>
      <option value="pago">Pagas</option>
    </select>
  </section>

  <!-- RESUMO -->
  <section class="card resumo">
    <div class="resumo-item">
      <span>🕒 Pendentes</span>
      <strong id="totalPendentes">R$ 0,00</strong>
    </div>

    <div class="resumo-item pago">
      <span>✅ Pagas</span>
      <strong id="totalPagas">R$ 0,00</strong>
    </div>
  </section>

  <!-- LISTA -->
  <section class="card">
    <h2>📋 Lista de Contas</h2>
    <div id="lista"></div>
  </section>

  <!-- CALENDÁRIO -->
  <section class="card">
    <div class="calendario-header">
      <button onclick="mudarMes(-1)">◀</button>
      <h2 id="mesAno"></h2>
      <button onclick="mudarMes(1)">▶</button>
    </div>
    <div id="calendario" class="calendario"></div>
  </section>

</div>

<!-- ========================= -->
<!-- MODAL CADASTRO -->
<!-- ========================= -->
<div class="modal" id="modalCadastro">
  <div class="modal-content">
    <h2>➕ Nova Conta</h2>

    <div class="campo">
      <label>Nome da conta</label>
      <input type="text" id="nome">
    </div>

    <div class="campo">
      <label>Valor Total</label>
      <input type="number" id="valor" step="0.01">
    </div>

    <div class="campo">
      <label>Data</label>
      <input type="date" id="data">
    </div>

    <div class="campo">
      <label>Parcelas</label>
      <input type="number" id="parcelas" value="1" min="1">
    </div>

    <div class="campo">
      <label>Cor da Conta</label>
      <input type="color" id="corConta" value="#3498db">
    </div>

    <div class="modal-botoes">
      <button class="btn-primary" onclick="adicionarConta()">
        Adicionar
      </button>
      <button class="btn-danger" onclick="fecharModalCadastro()">
        Cancelar
      </button>
    </div>
  </div>
</div>

<!-- ========================= -->
<!-- MODAL EDIÇÃO -->
<!-- ========================= -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2>✏️ Editar Conta</h2>

    <div class="campo">
      <label>Nome da conta</label>
      <input type="text" id="editNome">
    </div>

    <div class="campo">
      <label>Valor</label>
      <input type="number" id="editValor" step="0.01">
    </div>

    <div class="campo">
      <label>Data</label>
      <input type="date" id="editData">
    </div>

    <div class="campo">
      <label>Cor da Conta</label>
      <input type="color" id="editCor" value="#3498db">
    </div>

    <div class="modal-botoes">
      <button class="btn-primary" onclick="salvarEdicao()">
        Salvar
      </button>
      <button class="btn-danger" onclick="fecharModal()">
        Cancelar
      </button>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
